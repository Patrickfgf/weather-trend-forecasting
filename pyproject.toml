[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-forecast"
version = "0.1.0"
description = "Weather Trend Forecasting on the Kaggle Global Weather Repository"
readme = "README.md"
requires-python = ">=3.11"
# Runtime deps are pinned in requirements.txt for reproducibility; kept empty here
# so `pip install -e .` does not fight the pinned lockfile.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::FutureWarning",
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
